[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scs-sdk"
version = "1.0.0"
description = "Python SDK for SCS (Spyxpo Cloud Services) - A self-hosted Firebase alternative"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Spyxpo", email = "support@spyxpo.com"}
]
maintainers = [
    {name = "Spyxpo", email = "support@spyxpo.com"}
]
keywords = [
    "scs",
    "spyxpo",
    "firebase",
    "baas",
    "backend",
    "cloud",
    "database",
    "storage",
    "authentication",
    "realtime",
    "serverless",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25.0",
]

[project.optional-dependencies]
realtime = [
    "python-socketio[client]>=5.0.0",
]
all = [
    "python-socketio[client]>=5.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "types-requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/spyxpo/scs"
Documentation = "https://docs.spyxpo.com/scs"
Repository = "https://github.com/spyxpo/scs"
Issues = "https://github.com/spyxpo/scs/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["scs*"]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=scs --cov-report=term-missing"
